spring.application.name=CatalogQueriesService

server.port=8087

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5437/catalogQueries
spring.datasource.password=catalogQueries
spring.datasource.username=catalogQueries

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=catalog-queries-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer