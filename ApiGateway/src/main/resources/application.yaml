spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates: ["Path=/api/auth/**"]
              filters:
                - StripPrefix=1

            - id: card-service
              uri: http://localhost:8082
              predicates: ["Path=/api/cards/**"]
              filters:
                - StripPrefix=1

            - id: order-commands
              uri: http://localhost:8084
              predicates: [ "Path=/api/orders/**", "Method=POST, PUT, DELETE" ]
              filters:
                - StripPrefix=1

            - id: inventory-commands
              uri: http://localhost:8085
              predicates: [ "Path=/api/inventory/**", "Method=POST, PUT, DELETE" ]
              filters:
                - StripPrefix=1

            - id: order-request
              uri: http://localhost:8086
              predicates: ["Path=/api/orders/**", "Method=GET"]
              filters:
                - StripPrefix=1

            - id: inventory-request
              uri: http://localhost:8087
              predicates: ["Path=/api/inventory/**", "GET"]
              filters:
                - StripPrefix=1

            - id: analytics-service
              uri: http://localhost:8088
              predicates: ["Path=/api/analytics/**"]
              filters:
                - StripFilter=1
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyREsolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestTokens: 1

  data:
    redis:
          host: localhost
          port: 6379
  security:
    oauth2:
          resourceserver:
            jwt:
              public-key-location: classpath:public.pem


server:
  port: 8080
