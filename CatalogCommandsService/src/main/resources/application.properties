spring.application.name=InventoryCommandsService

server.port=8085

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=catalog-command
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=catalogCommands
spring.datasource.password=catalogCommands
spring.datasource.url=jdbc:postgresql://localhost:5436/catalogCommands

spring.jpa.hibernate.ddl-auto=update