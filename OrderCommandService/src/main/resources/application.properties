spring.application.name=OrderCommandService

server.port=8084

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=order-command
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5435/orderCommands
spring.datasource.password=orderCommands
spring.datasource.username=orderCommands

spring.jpa.hibernate.ddl-auto=update

payment.base-url=http://localhost:8083
