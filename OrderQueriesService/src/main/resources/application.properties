spring.application.name=OrderRequestService

server.port=8086

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=order-queries-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer