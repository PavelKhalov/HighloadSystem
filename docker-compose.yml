services:
  auth_db:
    image: postgres:16
    container_name: auth_db
    environment:
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_USER: auth
    ports:
      - "5432:5432"

  card_db:
    image: postgres:16
    container_name: card_db
    environment:
      POSTGRES_DB: card
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
    ports:
      - "5433:5432"

  payment_db:
    image: postgres:16
    container_name: payment_db
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5434:5432"

  order_commands_db:
    image: postgres:16
    container_name: order_commands
    environment:
      POSTGRES_DB: orderCommands
      POSTGRES_USER: orderCommands
      POSTGRES_PASSWORD: orderCommands
    ports:
      - "5435:5432"

  inventory_commands_db:
    image: postgres:16
    container_name: catalog_commands
    environment:
      POSTGRES_DB: catalogCommands
      POSTGRES_USER: catalogCommands
      POSTGRES_PASSWORD: catalogCommands
    ports:
      - "5436:5432"

  order_request_chace:
    image: redis:7
    container_name: order_queries_cahce
    ports:
      - "6379:6379"

  inventory_request_db:
    image: postgres:16
    container_name: catalog_queries
    environment:
      POSTGRES_DB: catalogQueries
      POSTGRES_PASSWORD: catalogQueries
      POSTGRES_USER: catalogQueries
    ports:
      - "5437:5432"

  analytics_db:
    image: postgres:16
    container_name: analytics_db
    environment:
      POSTGRES_DB: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_USER: analytics
    ports:
      - "5438:5432"


  kafka-0:
    # Будем использовать данный образ
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka-0
    hostname: kafka-0
    # Пробрасываем порты, чтоб слать в Kafka сообщения с хоста
    ports:
      - "29092:29092"
    environment:
      # Уникальный ID кластера в формате UUID
      CLUSTER_ID: ZETVJENWRjaECDUEExP_eg
      # Уникальный ID ноды внутри кластера
      KAFKA_NODE_ID: 0
      # Нода и контроллер, и брокер
      KAFKA_PROCESS_ROLES: broker,controller
      # "Слушатели" используются для указания способа подключения к Kafka-ноде,
      # То есть Kafka откроет порты и будет слушать на них подключения
      # В нашем случае первое слово - Alias, ://: - на всех сетевых интерфейсах,
      # Ну и в конце, очевидно, порт
      KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
      # Перечисляем список нод, которые являются контроллерами в формате
      # [NodeID]@[Hostname]:[Port]
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      # Здесь мы указываем, куда Kafka будет "перенаправлять" клиента после того,
      # Как тот подключится к ней. Контроллер не указываем, так как он нужен
      # Только для внутренней работы Kafka
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-0:9091,EXTERNAL://localhost:29092
      # Настраиваем шифрование
      # В нашем случае PLAINTEXT означает его отсутствие
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Указываем, что для контроллера используется "Слушатель" CONTROLLER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Указываем, что для брокеров используется "Слушатель" INTERNAL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  kafka-1:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "29093:29092"
    environment:
      CLUSTER_ID: ZETVJENWRjaECDUEExP_eg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9091,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  kafka-2:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29094:29092"
    environment:
      CLUSTER_ID: ZETVJENWRjaECDUEExP_eg
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9091,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL